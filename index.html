<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + env(safe-area-inset-*) gives the full-bleed standalone
         feel. user-scalable=no is deliberately NOT used — iOS ignores it, and
         pinch-zoom is an accessibility affordance a 70-year-old may want. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F1" />

    <!-- iOS uses this 180×180 link for the home-screen icon, not the manifest icons -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- v4 A6: «default» — dark status text. black-translucent painted WHITE text,
         which vanished over the light glass ground once the harbor header retired. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="مصاريف" />

    <!-- v4 A6/R14: launch images from the AO helm (scripts/make-icons.mjs), one per
         current iPhone. iOS freezes them at install — Dad's phone re-adds once (A8). -->
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/startup-1320x2868.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/startup-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/startup-1206x2622.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/startup-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/startup-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/startup-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/startup-828x1792.png" />

    <title>مصاريف</title>
  </head>

</html>
