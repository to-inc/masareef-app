<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + env(safe-area-inset-*) gives the full-bleed standalone
         feel. user-scalable=no is deliberately NOT used — iOS ignores it, and
         pinch-zoom is an accessibility affordance a 70-year-old may want. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E3B2E" />

    <!-- iOS uses this 180×180 link for the home-screen icon, not the manifest icons -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مصاريف" />

    <title>مصاريف</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
